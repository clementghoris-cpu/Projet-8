services:
  redis:
    image: redis:alpine
    container_name: redis_server
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - redis_net
      - api_net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redis_insight_data:/data
    networks:
      - redis_net
            
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - postgres_net
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER} -d ${POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_net
      - api_net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: credit_scoring_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
        # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

        # PostgreSQL
      - POSTGRESQL_HOST=${POSTGRESQL_HOST}
      - POSTGRESQL_PORT=${POSTGRESQL_PORT}
      - POSTGRESQL_DB=${POSTGRESQL_DB}
      - POSTGRESQL_USER=${POSTGRESQL_USER}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}    

      # API
      - API_ENABLE_CPROFILE=${API_ENABLE_CPROFILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api_net

  gradio:
    build: 
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: credit_scoring_ui
    ports:
      - "7860:7860"
    environment:    
      # API
      - API_URL=${API_URL}
      - API_PORT=${API_PORT}
      - API_PREDICT_ROUTE=${API_PREDICT_ROUTE}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - api_net


volumes:
  redis_data:
  redis_insight_data:
  postgres_data:

networks:
  api_net:
    driver: bridge
  redis_net:
    driver: bridge
  postgres_net:
    driver: bridge

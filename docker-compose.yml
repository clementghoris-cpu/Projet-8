services:
  redis:
    image: redis:alpine
    container_name: redis_server
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - redis_net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - redis_net
      
volumes:
  redis_data:
  redis_insight_data:

networks:
  redis_net:
    driver: bridge

[project]
name = "projet-8"
version = "0.1.0"
description = "Confirmez vos compétences en MLOps (Partie 2/2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.15.0",    
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.34.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.0",
    "skops>=0.14.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    
    "sqlalchemy>=2.0.52",
]
cache = [
    "redis>=8.1.0",
    "tqdm>=4.70.0",
]
gradio = [
    "gradio>=6.22.0",
    "requests>=2.34.2",
]
profiling = [
    "plotly>=5.24.1",
    "streamlit>=1.61.1",
]
drift = [
    "evidently>=0.7.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "fakeredis>=2.37.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

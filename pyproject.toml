[project]
name = "projet-8"
version = "0.1.0"
description = "Confirmez vos compétences en MLOps (Partie 2/2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "skops>=0.14.0",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "fakeredis>=2.37.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
